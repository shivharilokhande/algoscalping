services:
  autoscalp:
    build: .
    image: autoscalp:0.1.0
    container_name: autoscalp
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      AUTOSCALP_SYSTEM_MODE: PAPER          # change to LIVE only after live-readiness checklist
      KITE_API_KEY: ${KITE_API_KEY:-}
      KITE_API_SECRET: ${KITE_API_SECRET:-}
      KITE_ACCESS_TOKEN: ${KITE_ACCESS_TOKEN:-}
      KITE_USER_ID: ${KITE_USER_ID:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      TZ: Asia/Kolkata
      JAVA_OPTS: "-Xms256m -Xmx512m -XX:+UseZGC"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./models:/app/models
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
