# =====================================================================
# AutoScalp — primary configuration file (Spring Boot picks this up first)
# Credentials come from .env (loaded by AiScalpTraderApplication.main)
# or from real OS environment variables.
# =====================================================================

spring.application.name=AIScalpTrader
spring.profiles.active=paper
spring.jackson.serialization.write-dates-as-timestamps=false
spring.threads.virtual.enabled=true

server.port=${SERVER_PORT:8080}
server.servlet.context-path=/

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always

# --- Kite Connect credentials (resolved from .env or env vars) -----------
autoscalp.kite.api-key=${KITE_API_KEY:}
autoscalp.kite.api-secret=${KITE_API_SECRET:}
autoscalp.kite.access-token=${KITE_ACCESS_TOKEN:}
autoscalp.kite.request-token=${KITE_REQUEST_TOKEN:}
autoscalp.kite.user-id=${KITE_USER_ID:}

# --- System -------------------------------------------------------------
autoscalp.system.mode=${AUTOSCALP_SYSTEM_MODE:PAPER}
autoscalp.system.exchange=NSE
autoscalp.system.timezone=Asia/Kolkata
autoscalp.system.market-open=09:15
autoscalp.system.market-close=15:30
autoscalp.system.eod-close-time=15:25
autoscalp.system.state-file=data/state.json
autoscalp.system.pid-file=data/autoscalp.pid
autoscalp.system.heartbeat-file=data/heartbeat.txt
autoscalp.system.instruments[0]=256265
autoscalp.system.instruments[1]=260105
autoscalp.system.instruments[2]=257801
autoscalp.system.trading-symbols[256265]=NIFTY 50
autoscalp.system.trading-symbols[260105]=NIFTY BANK
autoscalp.system.trading-symbols[257801]=NIFTY FIN SERVICE

# --- Risk (BACKTEST-PROVEN — do not change without re-validation) ------
autoscalp.risk.capital=50000.00
autoscalp.risk.capital-per-trade-pct=0.30
autoscalp.risk.option-sl-pct=0.25
autoscalp.risk.option-tp-pct=0.30
autoscalp.risk.trail-activate-pct=0.45
autoscalp.risk.trail-gap-pct=0.09
autoscalp.risk.max-trades-per-day=5
autoscalp.risk.max-sl-per-day=2
autoscalp.risk.daily-profit-target-pct=0.20
autoscalp.risk.reduced-alloc-after-sl=0.20
autoscalp.risk.opening-gap-skip-pct=0.005
autoscalp.risk.max-concurrent-positions=1
autoscalp.risk.iv-elevated-tp-pct=0.20
autoscalp.risk.iv-elevated-zscore=1.3
autoscalp.risk.flash-crash-pct=0.03
autoscalp.risk.atr-low-percentile=25
autoscalp.risk.recovery-trade-time=13:30
autoscalp.risk.recovery-allocation-pct=0.10
autoscalp.risk.special-event-allocation-pct=0.15

# --- Strategy ----------------------------------------------------------
autoscalp.strategy.min-confluence-setups=2
autoscalp.strategy.confluence-window-bars=5
autoscalp.strategy.min-layer2-passed=3
autoscalp.strategy.rsi-period=14
autoscalp.strategy.atr-period=14
autoscalp.strategy.ema-fast=9
autoscalp.strategy.ema-slow=21
autoscalp.strategy.macd-fast=12
autoscalp.strategy.macd-slow=26
autoscalp.strategy.macd-signal=9
autoscalp.strategy.supertrend-period=10
autoscalp.strategy.supertrend-multiplier=3.0
autoscalp.strategy.orb-window-start=09:15
autoscalp.strategy.orb-window-end=09:30
autoscalp.strategy.orb-trade-window-end=10:30

# --- Options (NSE Jan 2026 lot sizes) ----------------------------------
autoscalp.options.lot-size[256265]=65
autoscalp.options.lot-size[260105]=30
autoscalp.options.lot-size[257801]=60
autoscalp.options.strike-interval[256265]=50
autoscalp.options.strike-interval[260105]=100
autoscalp.options.strike-interval[257801]=50
autoscalp.options.expiry-weekday[256265]=THURSDAY
autoscalp.options.expiry-weekday[260105]=WEDNESDAY
autoscalp.options.expiry-weekday[257801]=TUESDAY
autoscalp.options.prefer-itm=true
autoscalp.options.preferred-delta=0.5
autoscalp.options.risk-free-rate=0.07
autoscalp.options.annual-volatility-default=0.18

# --- Claude AI advisor (optional) --------------------------------------
autoscalp.ai.enabled=false
autoscalp.ai.api-key=${ANTHROPIC_API_KEY:}
autoscalp.ai.model=claude-sonnet-4-5-20250929
autoscalp.ai.pre-market-time=08:30
autoscalp.ai.post-market-time=16:00
autoscalp.ai.weekly-time=20:00
autoscalp.ai.day-plan-file=data/day_plan.json
autoscalp.ai.weekly-plan-file=data/weekly_plan.json
autoscalp.ai.review-dir=logs/reviews
autoscalp.ai.plan-stale-hours=12

# --- Logging files ------------------------------------------------------
autoscalp.logging.trades-file=logs/trades.json
autoscalp.logging.risk-file=logs/risk.json
autoscalp.logging.market-file=logs/market.json
autoscalp.logging.rotate-daily=true

# --- Console logging ----------------------------------------------------
logging.level.root=INFO
logging.level.com.trading.aiscalptrader=DEBUG
logging.pattern.console=%d{HH:mm:ss.SSS} %-5level [%thread] %logger{32} - %msg%n
